[project]
name = "ideascope-backend"
version = "0.0.1"
description = "Ideascope generation backend — FastAPI + Claude-powered lesson pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.69",
    "playwright>=1.61.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, flake8-bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These modules embed authored JS/SVG as triple-quoted strings; those lines are
# content, not Python style, so exempt them from line-length.
"scripts/build_fixtures.py" = ["E501"]
"app/generation/beat_prompts.py" = ["E501"]
"app/validation/runtime.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
