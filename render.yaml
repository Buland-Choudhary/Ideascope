# Render Blueprint (docs/PLAN.md §13) — one-click "New +  Blueprint" import
# picks this up automatically. Backend only; the frontend deploys separately
# on Netlify (see frontend/netlify.toml).
#
# Real generation, validation pipeline skipped (docs/PLAN.md Phase 10 note):
# IDEASCOPE_SKIP_VALIDATION=true means beats ship straight from Claude with
# no render-check/auto-fix/vision-critique — no Chromium needed, so this
# still fits Render's free 512MB tier even in real mode. Free-tier services
# spin down after 15 min idle (~30-60s cold start on wake) — fine for
# occasional checking, not for a live demo.
#
# IDEASCOPE_LESSONS_RATE_LIMIT tightened from the app default (20/hour) given
# the small $5 Anthropic credit budget — bounds worst-case spend from a
# single IP to a fraction of that budget per hour instead of exceeding it.
#
# IDEASCOPE_BEAT_MODEL pinned to claude-sonnet-5 (app default as of Phase-10-
# hardening) rather than opus: beat calls (one per beat, long code-generation
# output) dominate per-lesson spend, and sonnet cuts that ~40% while still
# being a strong coding model — the main cost lever available given
# skip_validation means there's no auto-fix/critique net to catch a bad
# generation either way. Set back to claude-opus-4-8 to trade cost for quality.
#
# NOTE: editing this file does NOT change an already-deployed Render service's
# env vars by itself — Render Blueprints apply on initial "New + Blueprint"
# creation. For an existing service, either trigger a Blueprint sync from the
# Render dashboard, or set the env var directly under the service's
# Environment tab.
#
# If validation is ever turned back on (set IDEASCOPE_SKIP_VALIDATION=false):
# switch the Dockerfile's base image to include Chromium and move off the
# free plan (512MB is too small) — `starter` is still only 512MB, so
# realistically `standard` ($25/mo, 2GB), or reconsider Fly.io (~$5.70/mo).
services:
  - type: web
    name: ideascope-backend
    runtime: docker
    plan: free
    # No rootDir here deliberately: Render's docs claim dockerfilePath/
    # dockerContext are always relative to the repo root regardless of
    # rootDir, but the actual behavior observed was rootDir + dockerContext
    # getting concatenated ("backend/backend" — no such path). Omitting
    # rootDir avoids that; the only cost is losing the "skip rebuild on
    # frontend-only changes" optimization, not a correctness issue.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: IDEASCOPE_MOCK_GENERATION
        value: "false"
      - key: IDEASCOPE_SKIP_VALIDATION
        value: "true"
      - key: IDEASCOPE_LESSONS_RATE_LIMIT
        value: "5/hour"
      - key: IDEASCOPE_BEAT_MODEL
        value: "claude-sonnet-5"
      - key: IDEASCOPE_ANTHROPIC_API_KEY
        sync: false
      - key: IDEASCOPE_CORS_ORIGINS
        sync: false
